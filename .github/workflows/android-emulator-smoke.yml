name: Link MP3 | Android Emulator Kurulum Testi

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install app, verify one screen and test saving/listing MP3
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            bash .github/scripts/verify_emulator_ui.sh
            gradle --no-daemon :app:connectedDebugAndroidTest
            # Gradle connected tests can uninstall the tested application at teardown.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.kadir.muzikindir.video272/com.kadir.linkdnm.Mp3ConverterActivity
            sleep 2
            adb shell pidof com.kadir.muzikindir.video272
            adb logcat -d -t 500 | grep -F 'FATAL EXCEPTION' && exit 1 || true
