name: Link MP3 | Android Emulator Kurulum Testi

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and start both Android activities
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.kadir.linkmp3.mobile/com.kadir.linkdnm.Mp3ConverterActivity
            sleep 5
            adb shell pidof com.kadir.linkmp3.mobile
            adb shell input swipe 510 1480 510 520 450
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window.xml >/dev/null
            python3 -c "import re,subprocess,xml.etree.ElementTree as ET; root=ET.parse('window.xml').getroot(); nodes=[n for n in root.iter('node') if 'MP3' in n.get('text','') and 'Aç' in n.get('text','')]; assert nodes, 'MP3 archive button not found'; bounds=[int(x) for x in re.findall('[0-9]+',nodes[0].get('bounds',''))]; assert len(bounds)==4; subprocess.run(['adb','shell','input','tap',str((bounds[0]+bounds[2])//2),str((bounds[1]+bounds[3])//2)],check=True)"
            sleep 3
            adb shell dumpsys activity activities | grep -F Mp3LibraryActivity
            adb shell pidof com.kadir.linkmp3.mobile
            adb logcat -d -t 500 | grep -F 'FATAL EXCEPTION' && exit 1 || true
