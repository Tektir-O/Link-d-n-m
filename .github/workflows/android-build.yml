name: Link MP3 | Android APK ve servis testleri

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: MP3 sunucusu HTTP ve URL testleri
        run: (cd mp3_service && python3 -m unittest -v test_app)
      - name: Kotlin birim testleri ve APK derleme
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: APK testleri (manifest, paket ve izinler)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee permissions.txt
          grep -F 'android.permission.INTERNET' permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.kadir.muzikindir.video25'" badging.txt
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          unzip -tq "$APK"
      - name: Test APK dosyası
        uses: actions/upload-artifact@v4
        with:
          name: muzik-indir-video-v25-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
