name: Link MP3 | Docker Sunucu Testi

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --pull -t link-mp3:ci ./mp3_service
      - name: Test Docker tools and HTTP health
        run: |
          set -eu
          docker run -d --name link-mp3-smoke -e LINK_MP3_PUBLIC_MODE=1 -p 127.0.0.1:18080:8080 link-mp3:ci
          trap 'docker logs link-mp3-smoke; docker rm -f link-mp3-smoke' EXIT
          docker exec link-mp3-smoke yt-dlp --version
          docker exec link-mp3-smoke deno --version
          docker exec link-mp3-smoke python -m pip show yt-dlp-ejs
          docker exec link-mp3-smoke ffmpeg -version
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              echo "Docker HTTP health is OK"
              code=$(curl -sS -o /tmp/mp3-bad.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"url":"https://invalid.example"}' http://127.0.0.1:18080/convert)
              test "$code" = 400
              grep -q 'error' /tmp/mp3-bad.json
              echo "Invalid URL rejected safely"
              # Generate a real two-second test video/audio on the CI runner.
              ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=320x240:r=10 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 2 -c:v mpeg4 -q:v 8 -c:a aac -shortest -y /tmp/local-mp3-test.mp4
              curl --fail --silent --show-error --max-time 65 -X POST -H 'Content-Type: video/mp4' --data-binary @/tmp/local-mp3-test.mp4 http://127.0.0.1:18080/convert-file -o /tmp/local-mp3-output.mp3
              ffprobe -v error -show_entries format=format_name,duration -of default=noprint_wrappers=1 /tmp/local-mp3-output.mp3 | tee /tmp/local-mp3-probe.txt
              grep -q mp3 /tmp/local-mp3-probe.txt
              test "$(stat -c%s /tmp/local-mp3-output.mp3)" -gt 1000
              echo "Real MP4 -> MP3 conversion verified"
              exit 0
            fi
            sleep 2
          done
          exit 1
